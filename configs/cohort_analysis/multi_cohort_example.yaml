# Multi-cohort analysis-plan example.
#
# NEW SCHEMA (top-level `analysis_plan`). Two entry points:
#
#   Plan only (no I/O, no embeddings):
#     python run_cohort_analysis.py --config configs/cohort_analysis/multi_cohort_example.yaml --dry-run-plan
#
#   Execute (analysis_plan.pairwise + analysis_plan.combined):
#     python run_cohort_analysis.py --config configs/cohort_analysis/multi_cohort_example.yaml --skip-plots --output-root <dir>
#
# Any config with a top-level `analysis_plan` key is auto-detected as
# multi-cohort and, when run without --dry-run-plan, executes the pairwise and
# combined sections. analysis_plan.comparisons is parsed and recorded in
# analysis_plan_resolved.json but NOT executed yet.
#
# The single-analysis configs (prmt7_ctnnd2.yaml, lins1_ctnnd2.yaml) keep their
# existing schema and behaviour and are unaffected by this file.

# ---------------------------------------------------------------------------
# Available cohorts
# ---------------------------------------------------------------------------
cohorts:
  PRMT7:
    embedding_file: analysis_metadata/PRMT7_embeddings_04102025_v1.1.0.pkl
    img_name_parser: drop_last_token
    label: PRMT7
    exclude_image_ids: []

  LINS1:
    # WARNING: this points at a PRMT7 embedding file. It is carried over from
    # the notebook (which flagged it "TODO: check this filename") and from
    # configs/cohort_analysis/lins1_ctnnd2.yaml. It is NOT a validated LINS1
    # embedding. Replace embedding_file with the correct LINS1 embedding before
    # running any LINS1 analysis; until then LINS1 numbers are not a result.
    embedding_file: analysis_metadata/PRMT7_embeddings_04102025_v1.1.0.pkl
    img_name_parser: drop_last_token
    label: LINS1
    exclude_image_ids: []
    warning: >-
      embedding_file points to the PRMT7 embedding pickle, not a validated LINS1
      embedding (carried over from lins1_ctnnd2.yaml / the notebook). Provide a
      correct LINS1 embedding before running LINS1 analysis.

  CTNND2:
    embedding_file: analysis_metadata/CTNND2_gmdb_encodings_v1.1.0.pkl
    img_name_parser: drop_last_token
    label: CTNND2
    exclude_image_ids: []

# ---------------------------------------------------------------------------
# Shared reference / analysis settings
#
# Ignored by --dry-run-plan (which only reads `cohorts` and `analysis_plan`).
# Used when the plan is EXECUTED, applied identically to every pairwise cohort.
# Values mirror configs/cohort_analysis/prmt7_ctnnd2.yaml so per-cohort pairwise
# numbers stay comparable to the single-analysis pipeline.
# ---------------------------------------------------------------------------
output_root: analysis_output

gallery_embedding_file: analysis_metadata/all_gmdb_encodings_v1.1.0_23052026.pkl
gallery_metadata_files:
  - analysis_metadata/gmdb_metadata/gmdb_frequent_gallery_images_v1.0.3.csv
  - analysis_metadata/gmdb_metadata/gmdb_frequent_test_images_v1.0.3.csv
  - analysis_metadata/gmdb_metadata/gmdb_rare_gallery_images_v1.0.3.csv

photo_metadata_file: analysis_metadata/patient_metadata_23052026.tsv
photo_metadata_sep: "\t"
frontal_face_only: true

distance_metric: cosine
n_tta: 12
random_seed: 0

# Pairwise heatmap (only used when heatmaps are generated, i.e. no --skip-plots)
heatmap_source: rank
display_match_box: false
input_crops_path: null
default_x_offset: 1.16
default_y_offset: -0.15

# ---------------------------------------------------------------------------
# Analysis plan
#   pairwise     -> EXECUTED
#   combined     -> EXECUTED
#   comparisons  -> parsed + recorded, NOT executed yet
# ---------------------------------------------------------------------------
analysis_plan:
  pairwise:
    mode: all               # all | none | explicit (with cohorts: [...])

  comparisons:
    mode: all_directed       # all_directed | all_undirected | none | explicit

  combined:
    - name: PRMT7_LINS1
      cohorts: [PRMT7, LINS1]
